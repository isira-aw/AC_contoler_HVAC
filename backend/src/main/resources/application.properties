# Server Configuration
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hvac_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# MQTT Configuration (Fixed - External Broker)
mqtt.broker.url=tcp://${MOSQUITTO_HOST:trolley.proxy.rlwy.net}:${MOSQUITTO_PORT:26703}
mqtt.broker.username=${MOSQUITTO_USERNAME:generator-monitoring-system}
mqtt.broker.password=${MOSQUITTO_PASSWORD:di1u5ydet0z049vbbl08cofp6vhya45l}
mqtt.client.id=hvac-backend-${random.uuid}
mqtt.topic.telemetry=hvac/+/telemetry
mqtt.topic.control=hvac/{device_id}/control
mqtt.topic.status=hvac/+/status

# JWT Configuration
jwt.secret=${JWT_SECRET:hvac-iot-secret-key-2024-very-secure-minimum-256-bits-long-key}
jwt.expiration=21600000

# Email Configuration (for 2FA)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:isira.aw@gmail.com}
spring.mail.password=${MAIL_PASSWORD:cedm mgtv ykaq bgcz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# Telemetry Retention (7 days in milliseconds)
telemetry.retention.days=7

# Logging
logging.level.com.hvac=INFO
logging.level.org.eclipse.paho=WARN

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,https://live-ac.tech,https://www.live-ac.tech}

# Actuator for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
