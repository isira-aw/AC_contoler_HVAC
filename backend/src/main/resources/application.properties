# Server Configuration
server.port=${SERVER_PORT:8080}

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hvac_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# MQTT Configuration (External Broker)
mqtt.broker.url=tcp://${MOSQUITTO_HOST:trolley.proxy.rlwy.net}:${MOSQUITTO_PORT:26703}
mqtt.broker.username=${MOSQUITTO_USERNAME:hvac-monitoring-system}
mqtt.broker.password=${MOSQUITTO_PASSWORD:}
mqtt.client.id=hvac-backend-${random.uuid}
mqtt.topic.telemetry=hvac/+/telemetry
mqtt.topic.control=hvac/{device_id}/control
mqtt.topic.status=hvac/+/status

# JWT Configuration
jwt.secret=${JWT_SECRET:change-this-in-production-minimum-256-bits-long-key}
jwt.expiration=${JWT_EXPIRATION:21600000}

# Email Configuration (for 2FA)
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# Telemetry Retention (7 days)
telemetry.retention.days=7

# Logging
logging.level.com.hvac=INFO
logging.level.org.eclipse.paho=WARN

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Actuator (Health checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
