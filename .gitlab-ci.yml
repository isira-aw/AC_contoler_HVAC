stages:
  - test
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

# Cache dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository
    - customer_portal/node_modules/

# ============ TEST STAGE ============
test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn clean verify -B -DskipTests=false
  only:
    - main
    - merge_requests
  cache:
    key: maven-${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository

test-frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd customer_portal
    - npm ci
    - npm run lint || true
    - npm run build
  only:
    - main
    - merge_requests
  cache:
    key: npm-${CI_COMMIT_REF_SLUG}
    paths:
      - customer_portal/node_modules/

# ============ BUILD STAGE ============
build-backend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/backend:latest ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  only:
    - main

build-customer-portal:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
        --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=$NEXT_PUBLIC_GOOGLE_CLIENT_ID \
        -t $CI_REGISTRY_IMAGE/customer-portal:$CI_COMMIT_SHA \
        -t $CI_REGISTRY_IMAGE/customer-portal:latest \
        ./customer_portal
    - docker push $CI_REGISTRY_IMAGE/customer-portal:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/customer-portal:latest
  only:
    - main

# ============ DEPLOY STAGE ============
deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh $SSH_USER@$SSH_HOST << 'ENDSSH'
        cd /opt/hvac

        # Pull latest images
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker-compose pull

        # Restart services with zero downtime
        docker-compose up -d --remove-orphans

        # Clean up old images
        docker image prune -f

        # Verify deployment
        sleep 30
        curl -f http://localhost/health || exit 1

        echo "Deployment successful!"
      ENDSSH
  only:
    - main
  when: manual
  environment:
    name: production
    url: https://live-ac.tech
