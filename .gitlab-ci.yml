# =====================================================
# DEPLOY STAGE
# =====================================================

deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh root@$SERVER_IP << 'ENDSSH'
        cd /opt/hvac
        docker compose pull
        docker compose up -d --remove-orphans
        docker system prune -f
      ENDSSH
  only:
    - main
    - master
  when: manual
  environment:
    name: production
    url: https://live-ac.tech
  tags:
    - docker

# =====================================================
# DEPLOY TO DOKPLOY (Alternative)
# =====================================================

deploy-dokploy:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - |
      curl -X POST "$DOKPLOY_WEBHOOK_URL" \
        -H "Content-Type: application/json" \
        -d '{"ref": "'"$CI_COMMIT_REF_NAME"'", "sha": "'"$CI_COMMIT_SHA"'"}'
  only:
    - main
    - master
  when: manual
  environment:
    name: production
    url: https://live-ac.tech
